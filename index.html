<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT301 Lab12</title>
    <style>

    </style>
</head>
<body>

    <p>Enter your Name:</p>
    <input type="text" id="name" placeholder="Your name">
    <p id="greeting"></p>

    <p>Enter the Numbers:</p>
    <input type="number" id="num1" placeholder="First number">
    <input type="number" id="num2" placeholder="Second number">

    <p>Choose a calculation:</p>
    <input type="radio" name="operation" value="add"> Add
    <input type="radio" name="operation" value="sub"> Subtract
    <input type="radio" name="operation" value="mul"> Multiply
    <input type="radio" name="operation" value="div"> Divide
    
    <br>
    <br>
    
    <button id="submit">Submit</button>
    <button id="clear">Clear</button>

    <p id="result"></p>

    <script>
        document.getElementById('submit').addEventListener('click', function() {
            const name = document.getElementById('name').value;
            const a = Number(document.getElementById('num1').value);
            const b = Number(document.getElementById('num2').value);
            const operation = document.querySelector('input[name="operation"]:checked').value;

            document.getElementById('greeting').textContent = (name);

            if (operation === 'add') answer = a + b;
            if (operation === 'sub') answer = a - b;
            if (operation === 'mul') answer = a * b;
            if (operation === 'div') answer = a / b;

            document.getElementById('result').textContent = 'Result: ' + answer;
        });

        document.getElementById('clear').addEventListener('click', function() {
            document.getElementById('name').value = '';
            document.getElementById('num1').value = '';
            document.getElementById('num2').value = '';
            document.getElementById('greeting').textContent = '';
            document.getElementById('result').textContent = '';
        });
    </script>

</body>
